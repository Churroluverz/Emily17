<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emily's Birthday</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=DM+Mono:wght@400&family=Hanken+Grotesk:wght@300;400;500&display=swap">
<style>
/* Layout: pure black, quiet type. Muted clips scattered with parallax, balloons rising behind everything, candles lit by scroll at the end. */
:root {
  --bg: #000000;
  --fg: #f2f2f0;
  --mute: #8d8d8f;
  --line: rgba(242, 242, 240, 0.18);
  --soft: rgba(242, 242, 240, 0.05);
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-weight: 300; font-size: 16px; line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
main, footer { position: relative; z-index: 1; }
section { position: relative; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: clamp(72px, 12vw, 150px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; }
h2 { font-size: clamp(1.9rem, 4.6vw, 3.4rem); margin-top: 14px; }
em { font-style: italic; }
p { margin: 0; }

.progress { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 2px; background: var(--fg); transform-origin: 0 50%; transform: scaleX(0); z-index: 50; }

/* reveals */
.line { display: block; overflow: hidden; padding-bottom: .14em; margin-bottom: -.14em; }
.line > span { display: block; transform: translateY(115%); transition: transform 1.2s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.in > .line > span, .line.in > span { transform: none; }
.reveal { opacity: 0; transform: translateY(32px); transition: opacity 1s ease, transform 1s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }

/* HERO */
.hero .wrap { padding-block: clamp(36px, 6vw, 80px) clamp(64px, 9vw, 120px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(32px, 6vw, 80px); align-items: center; }
.hero h1 { font-size: clamp(2.8rem, 9.5vw, 7.4rem); line-height: .96; letter-spacing: -.03em; margin-top: clamp(20px, 4vw, 44px); }
.hero h1 em { display: inline-block; }
.count { margin-top: clamp(28px, 5vw, 56px); display: grid; gap: 6px; }
.status { display: flex; align-items: center; gap: 12px; font-size: 1rem; color: var(--fg); }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--fg); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242,242,240,.55); } 70%, 100% { box-shadow: 0 0 0 10px rgba(242,242,240,0); } }
.collage { position: relative; aspect-ratio: 5 / 6; max-width: 100%; }
.collage .clip:nth-child(1) { width: 56%; right: 0; top: 0; --r: 3deg; }
.collage .clip:nth-child(2) { width: 42%; left: 2%; bottom: 0; --r: -4deg; }
.collage .clip { position: absolute; }

/* CLIPS */
.clip { transform: translate3d(0, var(--py, 0px), 0) rotate(var(--r, 0deg)); will-change: transform; }
.clip-in { position: relative; aspect-ratio: 9 / 16; overflow: hidden; border: 1px solid var(--line); background: #0a0a0a; }
.clip video { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.06); transition: filter .6s ease; }
.clip:hover video { filter: none; }

/* EDIT */
.edit .wrap { display: grid; justify-items: center; text-align: center; gap: 8px; }
.frame { position: relative; width: min(560px, 100%); aspect-ratio: 1; margin-top: clamp(28px, 5vw, 56px); border: 1px solid var(--line); background: #000; transform: scale(var(--s, .92)); transition: transform .12s linear; }
.frame video { display: block; width: 100%; height: 100%; object-fit: cover; background: #000; }

/* MOMENTS */
.moments-grid { position: relative; display: grid; grid-template-columns: repeat(12, 1fr); gap: clamp(10px, 2vw, 24px); margin-top: clamp(32px, 6vw, 72px); align-items: start; }
.moments-grid .clip:nth-child(1) { grid-column: 1 / span 4; --r: -2deg; }
.moments-grid .clip:nth-child(2) { grid-column: 5 / span 3; margin-top: clamp(40px, 9vw, 130px); --r: 2.5deg; }
.moments-grid .clip:nth-child(3) { grid-column: 9 / span 4; margin-top: clamp(10px, 3vw, 40px); --r: -1.5deg; }

/* BUDGET */
.budget-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.budget-head .clip { width: clamp(96px, 16vw, 168px); flex: none; --r: 4deg; }
.flag-wrap { width: clamp(96px, 14vw, 132px); margin-top: 28px; }
.flag-wrap canvas { display: block; width: 100%; height: auto; }
.budget-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); margin-top: clamp(24px, 5vw, 56px); align-items: start; }
.groups { display: grid; gap: 32px; }
.group h3 { margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); font-weight: 400; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.item { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 20px 1fr auto; gap: 16px; align-items: center; width: 100%; padding: 15px 0; border-bottom: 1px solid var(--line); cursor: pointer; transition: padding .3s; }
.item:hover { padding-left: 8px; }
.item:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
.box { width: 18px; height: 18px; border: 1px solid var(--fg); display: grid; place-items: center; }
.box::after { content: ""; width: 8px; height: 8px; background: var(--fg); transform: scale(0); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.item[aria-pressed="true"] .box::after { transform: scale(1); }
.nm { min-width: 0; font-weight: 400; }
.nm small { display: block; font-weight: 300; color: var(--mute); font-size: .84rem; }
.pr { font-family: var(--display); font-size: 1.35rem; font-variant-numeric: tabular-nums lining-nums; }
.item[aria-pressed="false"] .nm, .item[aria-pressed="false"] .pr { opacity: .45; }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); border: 1px solid var(--line); padding: clamp(20px, 3vw, 32px); display: grid; gap: 20px; background: rgba(0,0,0,.85); }
.total { font-family: var(--display); font-size: clamp(3.6rem, 9vw, 6rem); line-height: .9; letter-spacing: -.04em; font-variant-numeric: tabular-nums lining-nums; }
.total sup { font-size: .38em; vertical-align: top; position: relative; top: .2em; margin-right: .06em; }
.bar { height: 6px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--fg); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar.over i { background: repeating-linear-gradient(45deg, var(--fg) 0 5px, #000 5px 10px); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.stats strong { display: block; font-family: var(--display); font-weight: 400; font-size: 1.8rem; line-height: 1.15; font-variant-numeric: tabular-nums lining-nums; }
.picked { margin: 0; padding: 16px 0 0; list-style: none; display: grid; gap: 5px; font-size: .9rem; border-top: 1px solid var(--line); }
.picked li { display: flex; justify-content: space-between; gap: 12px; }
.picked li span:last-child { font-variant-numeric: tabular-nums; color: var(--mute); }
.btn { all: unset; box-sizing: border-box; cursor: pointer; text-align: center; padding: 13px 18px; border: 1px solid var(--fg); font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; transition: background .25s, color .25s, opacity .5s; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }

/* CANDLES */
.wish { height: 280vh; }
.wish-stick { position: sticky; top: 0; height: 100vh; height: 100svh; display: grid; place-content: center; justify-items: center; gap: 28px; text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.cake { width: min(520px, 90vw); }
.candles { display: flex; justify-content: space-between; align-items: flex-end; width: 74%; margin: 0 auto; height: 96px; }
.candle { position: relative; width: 5px; height: calc(44px + var(--h) * 1px); background: repeating-linear-gradient(180deg, var(--fg) 0 6px, #5c5c5e 6px 9px); }
.flame { position: absolute; left: 50%; bottom: 100%; margin-bottom: 3px; width: 9px; height: 17px; transform: translateX(-50%) scale(0); transform-origin: 50% 100%; border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%; background: radial-gradient(ellipse at 50% 72%, #fff 0 28%, rgba(255,255,255,.85) 52%, rgba(255,255,255,0) 74%); box-shadow: 0 0 14px 4px rgba(255,255,255,.3); transition: transform .45s cubic-bezier(.3,1.5,.5,1); }
.candle.lit .flame { transform: translateX(-50%) scale(1); animation: flick .8s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.13s); }
@keyframes flick { to { transform: translateX(-50%) scale(.88, 1.12) rotate(-3deg); } }
.smoke { position: absolute; left: 50%; bottom: 100%; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.55); filter: blur(1.5px); opacity: 0; }
.blown .candle .flame { transform: translateX(-50%) scale(0); animation: none; transition: transform .25s calc(var(--i) * 70ms); }
.blown .smoke { animation: smoke 2.2s calc(var(--i) * 70ms + .15s) ease-out forwards; }
@keyframes smoke { 0% { opacity: .7; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx) * 1px), -64px) scale(7); } }
.tier { margin: 0 auto; border: 1px solid var(--fg); background: #000; }
.t1 { width: 74%; height: 56px; border-radius: 6px 6px 0 0; border-bottom: none; }
.t2 { width: 100%; height: 86px; border-radius: 8px 8px 0 0; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-size: 2.6rem; line-height: 1; border-bottom: none; }
.plate { width: 112%; margin: 0 -6%; height: 1px; background: var(--fg); position: relative; left: 0; }
.wish-meta { display: grid; gap: 22px; justify-items: center; min-height: 190px; align-content: start; }
.wish-ctl { display: grid; gap: 16px; justify-items: center; }
.wish-meta .btn { opacity: 0; pointer-events: none; transition: opacity .5s, background .25s, color .25s, box-shadow .3s, transform .2s; }
.wish.ready .wish-meta .btn, .wish.blown .wish-meta .btn { opacity: 1; pointer-events: auto; }
.wish.blown #litCount { visibility: hidden; }
.wish-btn { background: var(--fg); color: #000; padding: 17px 32px; border-radius: 999px; font-size: 12px; }
.wish-btn:hover { background: #fff; color: #000; transform: translateY(-2px); box-shadow: 0 0 0 6px rgba(255,255,255,.12), 0 0 44px rgba(255,255,255,.35); }
.wish-btn:active { transform: scale(.95); }
.wish.ready:not(.blown) .wish-btn { animation: ring 1.8s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.5); } 100% { box-shadow: 0 0 0 20px rgba(255,255,255,0); } }
.msg { font-family: var(--display); font-size: clamp(1.8rem, 5vw, 3.4rem); line-height: 1.05; min-height: 2.2em; opacity: 0; transform: translateY(14px); transition: opacity 1.4s .9s, transform 1.4s .9s; text-wrap: balance; }
.blown .msg { opacity: 1; transform: none; }
.t2 { transition: text-shadow 1.2s; }
.blown .t2 { text-shadow: 0 0 28px rgba(255,255,255,.7); }
.blown .cake { animation: pop .7s ease-out; }
@keyframes pop { 40% { transform: scale(1.045); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }
.flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 44; }
.flash.go { animation: flash .9s ease-out; }
@keyframes flash { 0% { opacity: .2; } 100% { opacity: 0; } }
.shock { position: fixed; width: 0; height: 0; border: 1px solid #fff; border-radius: 50%; pointer-events: none; z-index: 43; animation: shock 1.4s cubic-bezier(.1,.6,.2,1) forwards; }
@keyframes shock { from { width: 0; height: 0; margin: 0; opacity: .9; } to { width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0; } }

/* NOTE + FOOTER */
.note { max-width: 720px; display: grid; gap: 24px; position: relative; }
.note blockquote { margin: 0; font-family: var(--display); font-style: italic; font-size: clamp(1.5rem, 3.6vw, 2.5rem); line-height: 1.25; text-wrap: balance; }
.note-clip { width: 120px; --r: 5deg; margin-top: 24px; }
@media (min-width: 1000px) { .note-clip { position: absolute; right: -200px; top: 20px; width: 150px; margin-top: 0; } }
.ph { border-bottom: 1px dashed var(--mute); }
footer .wrap { padding-block: 40px
